# Pre-commit configuration for gopher-mcp
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # Pre-commit hooks for basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-docstring-first
      - id: debug-statements
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: fix-byte-order-marker

  # Ruff for linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      # Run the linter. The id is `ruff-check`; the old `ruff` id still works
      # but runs as "ruff (legacy alias)". The rev tracks the ruff version in
      # uv.lock so this gate and CI's `uv run ruff check .` agree.
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi, jupyter]
      # Run the formatter
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  # MyPy for static type checking, run out of the project's own locked
  # environment rather than a mirrors-mypy venv with a hand-synced
  # `additional_dependencies` list. That list is what drifted: it needs the
  # real pydantic-settings (without it mypy resolves BaseSettings to Any and
  # calls every config class "cannot subclass") and an mcp matching the API the
  # code targets, but nothing bumps it -- it sat on mcp==1.27.2 while uv.lock
  # had moved to 1.28.1, type-checking against an SDK the project no longer
  # resolves. `uv run` takes mypy and every stub straight from uv.lock, so this
  # gate cannot disagree with CI's `uv run mypy src` again. uv is already a
  # documented prerequisite (CONTRIBUTING: hooks are installed via
  # `uv run task install-hooks`), so `language: system` is safe here.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (locked environment)
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        require_serial: true
        args: [--ignore-missing-imports, --explicit-package-bases]
        exclude: ^(tests/|docs/|scripts/)

  # Bandit for security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]", "pbr"]
        exclude: ^(tests/|scripts/|task\.py)

  # Safety for dependency vulnerability scanning (disabled - requires Poetry)
  # - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
  #   rev: v1.3.2
  #   hooks:
  #     - id: python-safety-dependencies-check
  #       files: pyproject.toml

  # Conventional commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]

  # Check for secrets (commented out for now - can be enabled later)
  # - repo: https://github.com/Yelp/detect-secrets
  #   rev: v1.4.0
  #   hooks:
  #     - id: detect-secrets
  #       args: ['--baseline', '.secrets.baseline']
  #       exclude: package.lock.json

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        # MD060 (table-column-style) arrived in markdownlint-cli 0.46 and fires
        # 245 times across docs/ on tables that render fine; with --fix in play
        # it would silently reflow 14 documentation files on the next hook run.
        # Disabled here so the rev can stay current. Drop the flag (or set
        # "MD060": false in .markdownlint.json) only together with reflowing
        # those tables. The `--` terminates the flag so pre-commit's filenames
        # are still read as files.
        args: [--fix, --disable, MD060, --]
        exclude: ^CHANGELOG.md

  # YAML formatting. pre-commit/mirrors-prettier is archived upstream and its
  # last tag is a 4.0 alpha, so it will never see another fix; rbubley's mirror
  # is the maintained successor and tracks released prettier.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [yaml, markdown, json]
        exclude: ^(\.github/|docs/)

# No `ci:` block here on purpose. This repo carried a pre-commit.ci config for
# an app that was never installed on it -- no check run has ever come from
# pre-commit.ci -- which made the revs above look self-maintaining when in fact
# nothing bumps them (Dependabot has no pre-commit ecosystem). They are
# hand-maintained: run `uv run pre-commit autoupdate` as part of the release
# checklist. Re-add this block only together with installing the app.
