site_name: Gopher & Gemini MCP Server
site_description: A cross-platform Model Context Protocol (MCP) server for browsing Gopher and Gemini resources
site_url: https://cameronrye.github.io/gopher-mcp
repo_url: https://github.com/cameronrye/gopher-mcp
repo_name: cameronrye/gopher-mcp
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Configuration: configuration.md
      - Troubleshooting: troubleshooting.md
  - Using the Server:
      - API Reference: api-reference.md
      - AI Assistant Guide: ai-assistant-guide.md
  - Gemini:
      - Support and Trust Model: gemini-support.md
      - Gemini Troubleshooting: gemini-troubleshooting.md
  - Reference:
      - Architecture: architecture.md
      - Data Models: reference/models.md
      - Migration Guide: migration-guide.md
      - Changelog: changelog.md
      - Gopher Protocol: gopher-specification-for-llms.md
      - Gemini Protocol: gemini-specification-for-llms.md
  - Development:
      - Contributing: contributing.md
      - Releasing: development/releasing.md

# docs/overrides is the theme's custom_dir, read by Material directly. It also
# sits inside docs_dir, so without this MkDocs copies the raw Jinja template to
# site/overrides/main.html and publishes `{% extends "base.html" %}` as a page.
exclude_docs: |
  overrides/

# development/repository-setup.md documents this repository's own GitHub
# settings (branch protection, environments, secrets). It is maintainer
# runbook material rather than something a reader of the site needs, so it is
# built but deliberately kept out of the navigation.
not_in_nav: |
  development/repository-setup.md

plugins:
  - search
  - autorefs
  # The consistency pass merged three pages into their surviving neighbours.
  # Their URLs are published and linked from outside this repository, so each
  # one keeps answering with a redirect to the section that absorbed it rather
  # than a 404. The plugin lives in pyproject.toml's `docs` dependency group.
  - redirects:
      redirect_maps:
        # Security safeguards, caching, transports and the configuration
        # reference it duplicated are all in the configuration guide now.
        advanced-features.md: configuration.md
        # Folded into the one cross-protocol configuration page, as the
        # GEMINI_ table plus "Where Gemini state is stored".
        gemini-configuration.md: configuration.md#gemini-protocol-configuration-gemini_
        # `task.py` is gone; the taskipy table is described for contributors
        # in CONTRIBUTING.md, which is what this page includes.
        task-runner.md: contributing.md#the-task-runner
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_if_no_docstring: true
            members_order: source
            show_labels: true
            inherited_members: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # docs/contributing.md and docs/changelog.md are one-line includes of the
  # repository-root CONTRIBUTING.md and CHANGELOG.md, so the root is a snippet
  # base path. check_paths turns a missing include into a build failure instead
  # of a silently empty page.
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true

  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cameronrye/gopher-mcp
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/gopher-mcp/

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2025&ndash;2026 Cameron Rye
