version: 2
updates:
  # Python dependencies. The ecosystem must stay "uv", not "pip": the pip
  # ecosystem edits only the version ranges in pyproject.toml, and those ranges
  # are deliberately open floors (`pydantic>=2.5.0`, `anyio>=4.0.0`, ...), so it
  # had nothing to propose -- six range-edit PRs in a year, the group below
  # never firing once -- while uv.lock, the file every CI job installs via
  # `uv sync --locked`, never moved on a schedule at all. Only the "uv"
  # ecosystem updates uv.lock. Reverting to "pip" turns the Monday run back
  # into a no-op and leaves lock bumps arriving only as security advisories,
  # which is exactly what security-audit.yml tells the reader to wait for.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    # No `reviewers:` here or in the blocks below: GitHub removed the option on
    # 2025-05-20 and now ignores it. .github/CODEOWNERS (`* @cameronrye`) is
    # what actually requests review on Dependabot PRs. `assignees` still works.
    assignees:
      - "cameronrye"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    # Group minor and patch updates
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # The mcp cap in pyproject.toml is load-bearing: 2.x renamed FastMCP to
    # MCPServer, so widening it makes `pip install gopher-mcp` resolve a release
    # this code cannot import against. Dependabot cannot read the comment saying
    # so and proposed exactly that in #94. Migrating to the 2.x API is what
    # lifts the cap, not a version bump.
    ignore:
      - dependency-name: "mcp"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "cameronrye"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # Docker base image (Dockerfile uses python:3.x-slim in both stages). Without
  # this the runtime image's base never gets automated CVE-bump PRs, unlike
  # every other dependency in the repo.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "cameronrye"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    # Only semver-major is ignored here, and the absence of semver-minor is the
    # whole point of this block.
    #
    # The Dockerfile's tag is `python:3.14-slim`: major and minor, and nothing
    # else. A tag with no patch component can never produce a
    # `version-update:semver-patch`, so the only updates that exist for it are
    # minor (3.14 -> 3.15) and major (3 -> 4). Ignoring both, as this block used
    # to, left the docker ecosystem structurally unable to propose anything at
    # all: the entry ran every Monday and could not, even in principle, open a
    # PR. The "patch bumps are still welcome" the old comment promised needed a
    # three-component tag such as `python:3.14.2-slim`, which this Dockerfile
    # does not use.
    #
    # That argument is structural, and it has to be, because this repo's own
    # history cannot settle it either way. #67, "deps(deps): bump python from
    # 3.12-slim to 3.14-slim" (2026-06-11), is this ecosystem doing exactly the
    # job it exists for, and it is the only base-image PR it has ever produced
    # -- but the silence since then proves nothing about the ignore rule. #67
    # left the tag on 3.14-slim, still the newest two-component `-slim` line
    # Docker Hub publishes (3.15 exists only as `3.15-rc-slim`), so from June
    # until da73e1f rolled the tag back to 3.13-slim on 2026-08-31 there was
    # simply nothing to propose; and da73e1f landed at 20:31, after that
    # Monday's 09:00 run, so no scheduled pass has ever yet seen a 3.13 tag.
    # The by-hand 3.13 -> 3.14 bump in 0.9.1 is the PR the next Monday would
    # have owed us and, under the old two-line ignore, could not have opened.
    #
    # #67 also shows the shape to expect: Dependabot proposes the newest line,
    # not the next one (3.12 straight to 3.14, skipping 3.13), so a proposal can
    # arrive ahead of the test matrix. With 3.15 already at rc that is not
    # hypothetical, and it is what the review note below exists for.
    #
    # semver-major stays ignored: a python 4.x image line is not a base-image
    # refresh, it is a port, and it should not arrive as a Monday PR.
    #
    # What still protects the invariant -- the base image must stay on an
    # interpreter ci.yml's test matrix covers (3.11-3.14 today) -- is now review
    # rather than this file, which is the trade this change makes deliberately.
    # A minor bump arrives as a PR, not a merge; CODEOWNERS requests review on
    # it; and ci.yml's `docker` job builds the image and runs the installed
    # entrypoint on every PR, so a base image whose dependencies have no wheels
    # fails before anyone reads it. What that job does NOT check is matrix
    # coverage, and only the test matrix ever runs the suite on the container's
    # interpreter. So: read the Dockerfile's base-image comment before merging
    # one of these. If ci.yml's matrix does not already carry that Python
    # version green, widen the matrix first and close the PR.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
