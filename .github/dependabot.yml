version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "cameronrye"
    assignees:
      - "cameronrye"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    # Group minor and patch updates
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # The mcp cap in pyproject.toml is load-bearing: 2.x renamed FastMCP to
    # MCPServer, so widening it makes `pip install gopher-mcp` resolve a release
    # this code cannot import against. Dependabot cannot read the comment saying
    # so and proposed exactly that in #94. Migrating to the 2.x API is what
    # lifts the cap, not a version bump.
    ignore:
      - dependency-name: "mcp"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "cameronrye"
    assignees:
      - "cameronrye"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # Docker base image (Dockerfile uses python:3.x-slim in both stages). Without
  # this the runtime image's base never gets automated CVE-bump PRs, unlike
  # every other dependency in the repo.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "cameronrye"
    assignees:
      - "cameronrye"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    # The base image must stay on an interpreter the CI matrix covers, and the
    # Dockerfile comment saying so is invisible here. Left unpinned, the image
    # drifts ahead of the tested versions and only breaks for whoever runs the
    # container. Patch bumps are still welcome; widening the matrix is what
    # unblocks a minor or major one.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
