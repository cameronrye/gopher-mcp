name: Publish to TestPyPI

# Manual TestPyPI publishing only. Real PyPI releases are driven by release.yml
# on a pushed v* tag (with PyPI environment protection + trusted publishing) --
# this workflow deliberately does NOT publish to PyPI, so it offers no 'pypi'
# target (a 'pypi' choice here would build, report success, and publish nothing).
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target repository (TestPyPI only)'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi

# Least-privilege default; the publish jobs opt into id-token: write.
permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for proper versioning

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run pytest --cov-report=xml

      - name: Run security checks
        run: uv run bandit -r src/ -f json -o bandit-report.json

      # Advisory only, matching ci.yml and release.yml: the nightly
      # security-audit workflow is what turns a new advisory into an issue.
      - name: Run pip-audit dependency scan
        id: pip-audit
        continue-on-error: true
        run: uv run pip-audit --format json --output pip-audit-report.json

      - name: Report pip-audit findings
        if: steps.pip-audit.outcome == 'failure'
        run: |
          echo "::warning title=pip-audit::Dependency advisories found - see the nightly audit issue"

      - name: Build packages
        run: |
          uv build

      - name: Check distribution packages
        run: |
          uv run python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-packages
          path: dist/
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/gopher-mcp
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-packages
          path: dist/

      - name: Publish to TestPyPI
        # Pinned to a commit SHA (was the moving release/v1 branch) for
        # supply-chain safety on this id-token:write job; Dependabot bumps it.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
