name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Least-privilege default; jobs needing more must opt in explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Six hours is GitHub's default; the whole workflow finishes in 2-3
    # minutes, and these tests drive real sockets and TLS handshakes. A cap
    # this loose can only fire on a genuine hang, and turns one into a fast
    # red run instead of a runner parked for the rest of the afternoon.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.14 is here because the Docker base image and the trove classifiers
        # already depend on it: the Dockerfile ships python:3.14-slim and
        # pyproject.toml advertises the 3.14 classifier to PyPI. This matrix is
        # the only thing that runs the suite on that interpreter -- the `docker`
        # job below builds the image but only runs `gopher-mcp --help` in it --
        # so dropping 3.14 from this list does not roll either of them back the
        # way it once would have. It strands a shipped image and a published
        # classifier with nothing testing them. Note that dependabot.yml no
        # longer blocks a base-image minor bump either (see the comment there):
        # this list is what a reviewer checks a proposed bump against, not a
        # lock on one.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run pytest

  lint:
    # This job also builds the distribution and runs `twine check`, which used
    # to live in a separate Packaging workflow. Folding them in here costs
    # nothing -- `--all-groups` already installs twine, and the two commands
    # take seconds -- where the separate workflow spent a whole extra runner on
    # its own checkout, Python, uv and full `uv sync` to run them. The trigger
    # matters more than the file: both `push` and `pull_request` reach this
    # workflow, so packaging is checked on direct pushes to main too, which is
    # how most of this repo's commits actually land (main is unprotected). A
    # packaging break used to first surface mid-publish in release.yml; the
    # repo has been bitten by exactly that (see the hatchling pin comment in
    # pyproject.toml and 3ace3de "fix(deps): unbreak twine check").
    name: Lint, type check and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run ruff linting
        run: uv run ruff check .

      - name: Run ruff formatting check
        run: uv run ruff format --check .

      - name: Run mypy type checking
        run: uv run mypy src

      # Runs after the linters so a `dist/` tree never exists while ruff and
      # mypy walk the repo.
      - name: Build distribution
        run: uv build

      # The check that catches broken sdist/wheel metadata and a README
      # long_description PyPI would refuse to render.
      - name: Check distribution metadata
        run: uv run python -m twine check dist/*

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run bandit security linting
        run: uv run bandit -r src/ -f json -o bandit-report.json

      # Advisory only: a new advisory against a pinned dependency is not a
      # defect in the PR under test, so it must not gate unrelated work. The
      # nightly security-audit workflow files a tracking issue instead.
      - name: Run pip-audit dependency scan
        id: pip-audit
        continue-on-error: true
        run: uv run pip-audit --format json --output pip-audit-report.json

      - name: Report pip-audit findings
        if: steps.pip-audit.outcome == 'failure'
        run: |
          echo "::warning title=pip-audit::Dependency advisories found - see the security-reports artifact and the nightly audit issue"
          {
            echo "### ⚠️ pip-audit found dependency advisories"
            echo
            echo "This does **not** fail the build. Details are in the \`security-reports\` artifact,"
            echo "and the nightly [security audit](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/security-audit.yml) tracks them in an issue."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json

  minimum-versions:
    name: Declared minimum dependencies on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both ends of `requires-python = ">=3.11"`, because "the declared
        # floors" are not one set of versions -- they differ by interpreter,
        # and a 3.11-only job silently tested a combination no 3.14 user can
        # install.
        #
        # Measured, not assumed, with
        # `uv pip install --resolution lowest-direct --dry-run .` against a
        # 3.11 and a 3.14 venv at gopher-mcp 0.9.0:
        #   3.11 -> pydantic 2.11.0, the floor pyproject.toml declares
        #   3.14 -> pydantic 2.12.0
        # The split comes from mcp 1.28.1, which markers its own requirement by
        # interpreter -- `pydantic>=2.11.0; python_version < '3.14'` and
        # `pydantic>=2.12.0; python_version >= '3.14'` -- so pinning
        # pydantic==2.11.0 on 3.14 is not merely untested, it is unsolvable
        # ("Because mcp>=1.28.1 depends on pydantic>=2.12.0 ..."). Everything
        # else -- mcp 1.28.1, pydantic-settings 2.7.0, cryptography 50.0.0,
        # structlog 23.2.0, uvicorn 0.31.1 -- resolves identically on both.
        #
        # 3.12 and 3.13 are deliberately absent: they resolve the same floor
        # set as 3.11, so they would only spend runner time. Add the newest
        # interpreter here whenever the test matrix above grows one, or this
        # job goes back to testing floors nobody runs.
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Every other install in this repo resolves highest -- `uv sync --locked`
      # pins the lockfile, the Docker image pip-installs into a clean image --
      # so nothing has ever run this package against the floors it publishes.
      # That is how `mcp>=1.0.0` and `pydantic-settings>=2.0.0` both drifted
      # into admitting versions that crash at import while `pip check` stayed
      # happy. --resolution lowest-direct pins the declared dependencies to
      # their floors and leaves transitives alone.
      #
      # --no-default-groups is load-bearing, not tidiness: a bare
      # `--group test` ALSO installs the default `dev` group, and `dev` pulls
      # in `test` plus ruff/mypy/bandit/twine -- so the floors job would
      # additionally resolve every linter to its oldest permitted release and
      # fail on tooling that has nothing to do with the declared runtime
      # floors. This installs exactly the `test` group and the runtime deps.
      #
      # --python is explicit rather than trusting the step above: uv picks its
      # own interpreter, and any of 3.11-3.14 satisfies `requires-python`, so
      # without this a leg could resolve floors for a version it was not asked
      # about and the matrix would report a result it never measured.
      - name: Resolve the declared floors
        run: >-
          uv sync --resolution lowest-direct --no-default-groups --group test
          --python "${{ matrix.python-version }}"

      # The sync alone proves nothing: a bogus floor still resolves fine. Only
      # importing and running the code catches it, so this job must execute
      # something or it is green theatre.
      - name: Import and run at the floors
        run: |
          uv run --no-sync gopher-mcp --help
          uv run --no-sync python -c "import gopher_mcp; print(gopher_mcp.__version__)"

      - name: Run tests at the floors
        run: uv run --no-sync pytest --no-cov -q

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Buildx is preinstalled on the runner; no third-party action is needed,
      # and the job runs alongside the test matrix so it adds no wall-clock time.
      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --tag gopher-mcp:ci .

      - name: Smoke-test the image
        # The image's ENTRYPOINT is gopher-mcp, so this runs `gopher-mcp --help`
        # against the wheel as it was actually installed in the container.
        run: docker run --rm gopher-mcp:ci --help

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # --no-default-groups keeps this to mkdocs and the runtime deps; a bare
      # `--group docs` would drag in the whole `dev` group as well.
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group docs

      # --strict matches docs.yml and release.yml: without it a mkdocstrings
      # warning only surfaces at deploy time, after the merge.
      - name: Build documentation
        run: uv run mkdocs build --clean --strict

      # --strict only proves nothing warned, not that anything rendered. The
      # landing page's mermaid diagram shipped as literal `graph TB` text for a
      # year while every strict build passed, so assert the rendered HTML.
      - name: Check documentation rendered
        run: ./scripts/check-docs-render.sh site

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: site/
