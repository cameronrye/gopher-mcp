name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Least-privilege default; jobs needing more must opt in explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run pytest

  gemini-tests:
    name: Gemini Protocol Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run Gemini-specific tests
        # --no-cov: this runs only the Gemini subset, so it cannot meet the
        # project-wide --cov-fail-under gate in addopts. The full matrix job
        # enforces coverage; here we only care that the subset passes.
        run: |
          uv run pytest tests/test_gemini_client.py tests/test_gemini_models.py tests/test_gemini_status.py tests/test_gemini_tls.py tests/test_gemini_utils.py tests/test_security.py tests/test_performance.py -v --tb=short -m "not slow" --no-cov

      - name: Test Gemini client functionality
        run: |
          uv run python -c "
          import asyncio
          from src.gopher_mcp.server import get_client_manager

          async def test_gemini():
              manager = await get_client_manager()
              client = await manager.get_gemini_client()
              print('Gemini client created successfully')
              await client.close()

          asyncio.run(test_gemini())
          "

      - name: Validate Gemini configuration
        run: |
          export GEMINI_TOFU_ENABLED=true
          export GEMINI_CLIENT_CERTS_ENABLED=true
          uv run python -c "
          import asyncio
          from src.gopher_mcp.server import get_client_manager

          async def test_config():
              manager = await get_client_manager()
              client = await manager.get_gemini_client()
              print('Gemini configuration validated')
              await client.close()

          asyncio.run(test_config())
          "

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run ruff linting
        run: uv run ruff check .

      - name: Run ruff formatting check
        run: uv run ruff format --check .

      - name: Run mypy type checking
        run: uv run mypy src

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run bandit security linting
        run: uv run bandit -r src/ -f json -o bandit-report.json

      # Advisory only: a new advisory against a pinned dependency is not a
      # defect in the PR under test, so it must not gate unrelated work. The
      # nightly security-audit workflow files a tracking issue instead.
      - name: Run pip-audit dependency scan
        id: pip-audit
        continue-on-error: true
        run: uv run pip-audit --format json --output pip-audit-report.json

      - name: Report pip-audit findings
        if: steps.pip-audit.outcome == 'failure'
        run: |
          echo "::warning title=pip-audit::Dependency advisories found - see the security-reports artifact and the nightly audit issue"
          {
            echo "### ⚠️ pip-audit found dependency advisories"
            echo
            echo "This does **not** fail the build. Details are in the \`security-reports\` artifact,"
            echo "and the nightly [security audit](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/security-audit.yml) tracks them in an issue."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Buildx is preinstalled on the runner; no third-party action is needed,
      # and the job runs alongside the test matrix so it adds no wall-clock time.
      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --tag gopher-mcp:ci .

      - name: Smoke-test the image
        # The image's ENTRYPOINT is gopher-mcp, so this runs `gopher-mcp --help`
        # against the wheel as it was actually installed in the container.
        run: docker run --rm gopher-mcp:ci --help

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra docs

      # --strict matches docs.yml and release.yml: without it a mkdocstrings
      # warning only surfaces at deploy time, after the merge.
      - name: Build documentation
        run: uv run mkdocs build --clean --strict

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: site/
