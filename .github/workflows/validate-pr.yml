name: Packaging

# Packaging checks, without requiring secrets. Formatting, linting, type
# checking, tests and the docs build all run in ci.yml, so repeating them here
# only burned a second runner -- this workflow is deliberately limited to what
# ci.yml does not cover: `uv build` + `twine check`.
#
# It runs on push as well as pull_request because main is unprotected and this
# repo's commits mostly land as direct pushes: with a pull_request-only trigger
# the twelve most recent main commits -- including one that rewrote 17 lines of
# pyproject.toml and two that rewrote the README used as long_description --
# never had their packaging metadata checked at all, and a break would first
# surface mid-publish in release.yml. The repo has already been bitten by
# exactly that class of failure (see the hatchling pin comment in
# pyproject.toml and 3ace3de "fix(deps): unbreak twine check").
#
# The file is still called validate-pr.yml so existing run history and any
# saved links keep resolving; the trigger, not the name, is what matters.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

# Fork PRs already get a read-only token; make it explicit.
permissions:
  contents: read

concurrency:
  # PRs key on the PR number so a force-push supersedes the previous run; push
  # runs key on the ref. cancel-in-progress is PR-only on purpose: every commit
  # that lands on main should get its own packaging verdict.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  validate:
    name: Build and check distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Build package
        run: uv build

      - name: Validate package
        run: uv run python -m twine check dist/*
