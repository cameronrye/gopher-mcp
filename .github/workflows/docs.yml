name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      # The API reference renders docstrings/models from source via
      # mkdocstrings, so a source change must redeploy the site too -- otherwise
      # the published reference silently drifts from the code.
      - 'src/**'
      - 'uv.lock'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    # GitHub's default is six hours. A mkdocs build takes ~1 minute, so this
    # cap only fires when something has hung (a stalled uv sync, a
    # mkdocstrings import that never returns) instead of holding the Pages
    # concurrency group -- which does not cancel in progress -- all day.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for git info

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # --no-default-groups keeps this to mkdocs and the runtime deps; a bare
      # `--group docs` would drag in the whole `dev` group as well.
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group docs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build documentation
        run: |
          uv run mkdocs build --clean --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  # Deployment job
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
